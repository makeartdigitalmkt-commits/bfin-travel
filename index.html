<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="description" content="BFin Travel: planeje quanto pode gastar na viagem e acompanhe cada gasto. Seus dados ficam no seu Google Drive.">
<meta name="build" content="20261112-184137">
<meta name="theme-color" content="#0a121b">
<link rel="manifest" href="manifest.webmanifest">

<title>BFin Travel</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: faixa escura da marca com logo, viagem atual e abas; painel em cartões com destaque neon
     (saldo, indicadores, categorias, gastos por dia); botão fixo para lançar gasto; folhas deslizantes.
     Marca BFin Travel: Azul Profundo #101C29, Verde Menta #64D6BD, Branco Gelo #F7F9FA, Manrope. */
  :root {
    --bg: #f2f6f8; --surface: #ffffff; --surface-2: #eef3f6; --ink: #101c29; --muted: #5b6c7b; --line: #dde6ec;
    --band: #101c29; --band-2: #1a2e42; --band-ink: #f7f9fa; --band-muted: #9db2c3;
    --accent: #0e9c80; --accent-ink: #ffffff; --accent-soft: #ddf5ef;
    --mint: #64d6bd; --cta: #64d6bd; --cta-ink: #08201b; --cta-2: #3fbf9f;
    --good: #157a4c; --good-bg: #dcf5e8; --warn: #8a5d00; --warn-bg: #fdefc9; --bad: #b03a24; --bad-bg: #fbe2dc;
    --c-transporte: #2f6fd6; --c-hospedagem: #7a4fd0; --c-restaurante: #e0663a; --c-mercado: #c98d0a;
    --c-passeios: #12a37a; --c-lazer: #d1477a; --c-local: #2a93a8; --c-outros: #7b8a96;
    --shadow: 0 1px 2px rgba(16, 28, 41, 0.05), 0 8px 24px rgba(16, 28, 41, 0.07);
    --glow: 0 8px 22px rgba(14, 156, 128, 0.28);
    --f-display: "Manrope", "Segoe UI", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a121b; --surface: #101c29; --surface-2: #16263a; --ink: #f7f9fa; --muted: #93a8b9; --line: #1f3347;
      --band: #0a121b; --band-2: #16263a; --band-ink: #f7f9fa; --band-muted: #8fa6b8;
      --accent: #64d6bd; --accent-ink: #08201b; --accent-soft: #12332f;
      --good: #7fe3b0; --good-bg: #12352a; --warn: #f2d27c; --warn-bg: #3a3214; --bad: #ff9f8c; --bad-bg: #3d1d19;
      --c-transporte: #5b9dff; --c-hospedagem: #a98bff; --c-restaurante: #ff8a5c; --c-mercado: #f5c451;
      --c-passeios: #4fe0a8; --c-lazer: #ff6fa8; --c-local: #4fd2e8; --c-outros: #8ea2b2;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); --glow: 0 0 26px rgba(100, 214, 189, 0.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a121b; --surface: #101c29; --surface-2: #16263a; --ink: #f7f9fa; --muted: #93a8b9; --line: #1f3347;
    --band: #0a121b; --band-2: #16263a; --band-ink: #f7f9fa; --band-muted: #8fa6b8;
    --accent: #64d6bd; --accent-ink: #08201b; --accent-soft: #12332f;
    --good: #7fe3b0; --good-bg: #12352a; --warn: #f2d27c; --warn-bg: #3a3214; --bad: #ff9f8c; --bad-bg: #3d1d19;
    --c-transporte: #5b9dff; --c-hospedagem: #a98bff; --c-restaurante: #ff8a5c; --c-mercado: #f5c451;
    --c-passeios: #4fe0a8; --c-lazer: #ff6fa8; --c-local: #4fd2e8; --c-outros: #8ea2b2;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35); --glow: 0 0 26px rgba(100, 214, 189, 0.45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
  .in { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* Faixa */
  .band { background: var(--band); color: var(--band-ink); }
  .band .in { padding-block: 14px 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; }
  .brand svg { color: var(--cta); }
  .tripbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tripbar select { min-height: 40px; border-radius: 999px; border: 1px solid var(--band-2); background: var(--band-2); color: var(--band-ink); padding: 0 14px; max-width: 240px; }
  .ghost { min-height: 40px; border-radius: 999px; border: 1px solid var(--band-muted); background: transparent; color: var(--band-ink); padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .ghost:hover { background: var(--band-2); }
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 22px 0 18px; }
  .hero h1 { font-family: var(--f-display); font-size: clamp(26px, 5vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--band-muted); font-size: 14px; margin-top: 8px; }
  .hero .meta b { color: var(--band-ink); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; background: var(--band-2); color: var(--band-ink); }
  .pill.sun { background: var(--cta); color: var(--cta-ink); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { border: 0; background: none; color: var(--band-muted); padding: 10px 14px 12px; font-weight: 600; font-size: 15px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; min-height: 44px; }
  .tabs button[aria-selected="true"] { color: var(--band-ink); border-bottom-color: var(--cta); }

  main.in { padding-block: 22px 110px; }
  .grid { display: grid; gap: 16px; }
  .g-hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.4fr); }
  .g-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 860px) { .g-hero, .g-two { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
  .card h2 { font-family: var(--f-display); font-size: 17px; font-weight: 600; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card h2 small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); }
  .muted { color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }

  /* Anel */
  .ringwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
  @media (max-width: 420px) { .ringwrap { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } }
  .ring { position: relative; width: 180px; height: 180px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c b { font-family: var(--f-display); font-size: 30px; line-height: 1; }
  .ring .c span { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .big { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.15; }
  .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; margin-top: 10px; }
  .status.good { background: var(--good-bg); color: var(--good); } .status.warn { background: var(--warn-bg); color: var(--warn); } .status.bad { background: var(--bad-bg); color: var(--bad); }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
  .kpi .l { font-size: 13px; color: var(--muted); font-weight: 500; }
  .kpi .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 12px; color: var(--muted); }

  /* Categorias */
  .cats { display: grid; gap: 14px; }
  .catrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .cic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
  .catrow .nm { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .catrow .nm span { font-weight: 500; color: var(--muted); font-size: 13px; }
  .track { position: relative; height: 8px; border-radius: 6px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
  .catrow .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
  .catrow .val small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .over { color: var(--bad); }

  /* Gráfico por dia */
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Lista de gastos */
  .list { display: grid; }
  .item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 10px; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--surface-2); }
  .item .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .d { font-size: 12px; color: var(--muted); }
  .item .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item .v small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .dayhead { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); padding: 16px 4px 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 12px; min-height: 36px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .fchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Botões e formulários */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; font-size: 15px; }
  .btn.solid { background: var(--accent); color: var(--accent-ink); }
  .btn.cta { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  .btn.danger.solid { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .f { display: grid; gap: 5px; min-width: 0; }
  .f label, .lbl { font-size: 13px; font-weight: 600; }
  .f input, .f select, .f textarea { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; width: 100%; min-width: 0; font-size: 16px; }
  .f input:focus, .f select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .f2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .money { font-family: var(--f-display); font-size: 32px !important; font-weight: 700; min-height: 64px !important; }
  .catpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 440px) { .catpick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .catpick button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; min-height: 76px; }
  .catpick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

  /* Folha deslizante */
  .scrim { position: fixed; inset: 0; background: rgba(5, 20, 19, 0.55); z-index: 30; display: grid; align-items: end; justify-items: center; }
  @media (min-width: 720px) { .scrim { align-items: center; } }
  .sheet { background: var(--surface); width: min(560px, 100%); max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
  @media (min-width: 720px) { .sheet { border-radius: 22px; } }
  .sheet h3 { font-family: var(--f-display); font-size: 20px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  .x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 18px; }
  .fab { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--cta); color: var(--cta-ink); font-weight: 700; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

  /* Orçamento */
  .budrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 130px 54px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .budrow:first-of-type { border-top: 0; }
  .budrow input { min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
  .budrow .pc { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 440px) { .budrow { grid-template-columns: 34px minmax(0, 1fr) 110px; } .budrow .pc { display: none; } }
  .sumbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin-top: 10px; font-weight: 600; }

  /* Dicas */
  .tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .tip { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
  .tip b { font-size: 15px; }
  .tip span { font-size: 13px; color: var(--muted); }
  .tip a { font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; }
  ul.clean { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

  .empty { text-align: center; padding: 40px 18px; display: grid; gap: 12px; justify-items: center; }
  .empty h2 { font-family: var(--f-display); font-size: 24px; margin: 0; }
  .notice { border-radius: 12px; padding: 10px 14px; font-size: 14px; background: var(--warn-bg); color: var(--warn); margin-bottom: 14px; }
  .notice.info { background: var(--accent-soft); color: var(--ink); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 40; font-size: 14px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .track i { transition: width .4s ease; } }

  /* Item com botão de editar */
  .item { grid-template-columns: 38px minmax(0, 1fr) auto 28px; }
  .item .edit { color: var(--muted); display: grid; place-items: center; }
  .item:hover .edit { color: var(--accent); }
  /* Campo de valor */
  .money-sm { font-family: var(--f-display); font-size: 20px !important; font-weight: 700; }
  /* Pagamento */
  .paypick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .paypick button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 4px; display: grid; justify-items: center; gap: 4px; cursor: pointer; font-size: 13px; font-weight: 600; min-height: 64px; color: var(--muted); }
  .paypick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); color: var(--ink); }
  .paysum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
  .paysum span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  /* Calendário */
  .cal { border: 1px solid var(--line); border-radius: 16px; padding: 10px; background: var(--surface); }
  .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .calhead b { font-family: var(--f-display); font-size: 16px; text-transform: capitalize; }
  .calnav { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 20px; cursor: pointer; }
  .calnav:hover { background: var(--accent-soft); }
  .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  .calwd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .calday { aspect-ratio: 1 / 1; max-height: 44px; border: 0; background: transparent; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; }
  .calday:hover { background: var(--surface-2); }
  .calday.trip { background: var(--accent-soft); }
  .calday.mid { background: var(--accent-soft); border-radius: 0; }
  .calday.start { border-radius: 12px 0 0 12px; } .calday.end { border-radius: 0 12px 12px 0; }
  .calday.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--cta); }
  .calday.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .calwrap { display: grid; gap: 8px; margin: 4px 0 8px; max-width: 380px; }
  .dpair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 12px; text-align: left; cursor: pointer; display: grid; gap: 1px; min-height: 52px; }
  .dbtn small { font-size: 12px; color: var(--muted); }
  .dbtn b { font-size: 15px; }
  .dbtn.ativo { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .dbtn.inline { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; border-radius: 999px; padding: 0 14px; font-weight: 600; font-size: 13px; }
  /* Relatório */
  .search { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font-size: 15px; margin-bottom: 6px; }
  .flab { display: block; margin: 8px 0 6px; color: var(--muted); }
  .reptop { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  /* Painel premium */
  .prem { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; padding: 24px; border-radius: 22px; color: var(--band-ink);
    background: radial-gradient(120% 140% at 0% 0%, #17605a 0%, var(--band) 55%, #072624 100%); box-shadow: 0 10px 30px rgba(7, 38, 36, 0.25); }
  @media (max-width: 820px) { .prem { grid-template-columns: minmax(0, 1fr); padding: 20px; } }
  .prem-l { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .prem-k { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--band-muted); }

function calendario(op) {
  var box = el("div", "cal");
  var base = op.sel || op.de || hoje();
  var mes = base.slice(0, 7);
  function desenhar() {
    box.textContent = "";
    var y = parseInt(mes.slice(0, 4), 10), m = parseInt(mes.slice(5, 7), 10) - 1;
    var head = el("div", "calhead");
    var prev = el("button", "calnav", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Mês anterior");
    var next = el("button", "calnav", "›"); next.type = "button"; next.setAttribute("aria-label", "Próximo mês");
    prev.onclick = function () { var d = new Date(y, m - 1, 1); mes = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); desenhar(); };
    next.onclick = function () { var d = new Date(y, m + 1, 1); mes = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); desenhar(); };
    var tit = el("b", null, MESES[m] + " de " + y);
    head.appendChild(prev); head.appendChild(tit); head.appendChild(next); box.appendChild(head);
    var grid = el("div", "calgrid");
    ["D", "S", "T", "Q", "Q", "S", "S"].forEach(function (d) { grid.appendChild(el("span", "calwd", d)); });
    var primeiro = new Date(y, m, 1).getDay(), totalDias = new Date(y, m + 1, 0).getDate();

      if (op.de && op.ate && ds > op.de && ds < op.ate) cls.push("mid");
      if (ds === op.sel || ds === op.de || ds === op.ate) cls.push("on");
      if (op.de && ds === op.de && op.ate && op.ate !== op.de) cls.push("start");

  claro: '<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
